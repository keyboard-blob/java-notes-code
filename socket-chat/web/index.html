<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>聊天室</title>
<style>
  :root {
    --bg: #14161c; --panel: #1c1f27; --mine: #3b6ef6; --other: #262a35;
    --text: #e8ebf2; --muted: #8b93a7; --line: #2a2f3b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  button, input { font: inherit; }

  /* 登录界面 */
  #login {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--bg);
  }
  #login .box {
    width: 300px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 12px;
  }
  #login h1 { margin: 0 0 4px; font-size: 20px; }
  #login .hint { color: var(--muted); font-size: 13px; min-height: 18px; }
  #login input {
    background: #22262f; border: 1px solid #333a48; color: var(--text);
    border-radius: 10px; padding: 10px 12px; outline: none;
  }
  #login input:focus { border-color: var(--mine); }
  #login .row { display: flex; gap: 10px; }
  #login .row button { flex: 1; }
  button.primary { background: var(--mine); color: #fff; border: 0; border-radius: 10px; padding: 10px; cursor: pointer; }
  button.ghost { background: #262a35; color: var(--text); border: 1px solid #333a48; border-radius: 10px; padding: 10px; cursor: pointer; }

  /* 主界面 */
  #app { display: none; position: fixed; inset: 0; }
  #app.on { display: flex; }
  #side {
    width: 190px; background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  #side .me { padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  #side .me #logout { font-weight: 400; font-size: 12px; color: var(--muted); cursor: pointer; }
  #side .me #logout:hover { color: #ff7b7b; }
  #side .list { flex: 1; overflow-y: auto; padding: 8px; }
  #side .item {
    padding: 9px 12px; border-radius: 10px; cursor: pointer; color: var(--text);
    display: flex; align-items: center; gap: 8px; font-size: 14px;
  }
  #side .item:hover { background: #232733; }
  #side .item.on { background: #2c3344; }
  #side .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ad07a; flex-shrink: 0; }
  #side .group { padding: 4px 12px; color: var(--muted); font-size: 12px; }
  #side .item.off { color: #6b7280; }
  #side .item.off .dot { background: #4a5161; }
  #side .item.off:hover { background: #1f232c; }
  #side .item .sub { margin-left: auto; font-size: 11px; color: #5b6273; }
  #side .item .badge {
    margin-left: auto; background: #e5484d; color: #fff; font-size: 11px;
    border-radius: 9px; padding: 1px 6px; min-width: 18px; text-align: center;
  }
  #side .item .sub + .badge { margin-left: 6px; }

  /* 右键 / 长按菜单 */
  #ctx {
    position: fixed; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 6px; display: none; z-index: 50;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .45); min-width: 110px;
  }
  #ctx.on { display: block; }
  #ctx div { padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  #ctx div:hover { background: #2c3344; }
  #ctx div.disabled { color: #5b6273; cursor: default; }
  #ctx div.disabled:hover { background: transparent; }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #head { padding: 11px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
  #list { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 76%; display: flex; flex-direction: column; gap: 3px; }
  .msg .who { font-size: 12px; color: var(--muted); padding: 0 4px; }
  .msg .bubble {
    background: var(--other); padding: 9px 13px; border-radius: 14px;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.mine { align-self: flex-end; align-items: flex-end; }
  .msg.mine .bubble { background: var(--mine); border-bottom-right-radius: 4px; }
  .msg.theirs .bubble { border-bottom-left-radius: 4px; }
  .msg img.emoji { width: 96px; border-radius: 10px; display: block; }
  .msg .file {
    background: var(--other); border-radius: 14px; padding: 10px 13px;
    display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text);
  }
  .msg.mine .file { background: var(--mine); }
  .msg .file .sz { color: rgba(255,255,255,.7); font-size: 12px; }
  .msg .time { font-size: 11px; color: var(--muted); padding: 0 4px; }
  .day { text-align: center; color: var(--muted); font-size: 12px; margin: 10px 0 2px; }

  #bar { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 12px; display: flex; gap: 8px; align-items: flex-end; }
  #bar textarea {
    flex: 1; background: #22262f; border: 1px solid #333a48; color: var(--text);
    border-radius: 10px; padding: 10px 13px; outline: none;
    resize: none; max-height: 120px; overflow-y: auto; line-height: 1.45;
    font-family: inherit; font-size: inherit;
  }
  #bar textarea:focus { border-color: var(--mine); }
  #bar button { border: 0; border-radius: 10px; padding: 0 16px; background: var(--mine); color: #fff; cursor: pointer; height: 38px; }
  #bar button.em { background: #2c3344; padding: 0 12px; }

  #emojiPanel {
    position: absolute; bottom: 68px; left: 200px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: none;
    grid-template-columns: repeat(4, 56px); gap: 8px; z-index: 10;
  }
  #emojiPanel.on { display: grid; }
  #emojiPanel img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; cursor: pointer; }
  #emojiPanel img:hover { outline: 2px solid var(--mine); }

  /* 手机竖屏 */
  @media (max-width: 700px) {
    #side { width: 106px; }
    #side .me { padding: 10px 10px; font-size: 13px; }
    #side .item { padding: 8px 9px; font-size: 13px; gap: 6px; }
    #side .group { padding: 4px 9px; font-size: 11px; }
    #head { padding: 9px 12px; font-size: 14px; }
    #list { padding: 10px; gap: 8px; }
    .msg { max-width: 86%; }
    #bar { padding: 8px; gap: 6px; flex-wrap: wrap; }
    #bar textarea { flex: 1 1 100%; order: -1; }
    #bar button { flex: 1 1 auto; white-space: nowrap; padding: 0 10px; font-size: 14px; }
    #bar textarea { padding: 9px 10px; font-size: 14px; }
    #emojiPanel { left: 8px; right: 8px; grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>聊天室</h1>
    <input id="lname" placeholder="昵称" maxlength="20" autocomplete="username">
    <input id="lpass" type="password" placeholder="密码" autocomplete="current-password">
    <div class="hint" id="lhint"></div>
    <div class="row">
      <button class="primary" id="doLogin">登录</button>
      <button class="ghost" id="doReg">注册</button>
    </div>
  </div>
</div>

<div id="app">
  <div id="side">
    <div class="me"><span id="meName"></span><span id="logout">退出</span></div>
    <div class="list" id="sideList"></div>
  </div>
  <div id="main">
    <div id="head">群聊</div>
    <div id="list"></div>
    <div id="bar">
      <button class="em" id="emojiBtn">表情</button>
      <button class="em" id="fileBtn">文件</button>
      <textarea id="text" rows="1" placeholder="说点什么…"></textarea>
      <button id="sendBtn">发送</button>
    </div>
    <input type="file" id="fileInput" style="display:none">
  </div>
  <div id="emojiPanel"></div>
  <div id="ctx"><div id="ctxRemove">移除会话</div></div>
</div>

<script>
const $ = id => document.getElementById(id);

let token = '', me = '';
let current = '群聊';
let since = 0;
const sessions = {};      // 会话名 -> 消息数组
const users = [];         // [{name, online}] 所有账号
//本地移除的会话（只影响这台设备），对方重新上线会自动加回来
const removed = new Set(JSON.parse(localStorage.getItem('removed') || '[]'));
const saveRemoved = () => localStorage.setItem('removed', JSON.stringify([...removed]));
const unread = {};        // 会话名 -> 未读条数
//已读位置存在服务端（按账号），换设备也同步
let readUpTo = {};
const saveRead = (chat) => fetch('/read?token=' + encodeURIComponent(token), {
  method: 'POST',
  body: new URLSearchParams({ chat, id: readUpTo[chat] || 0 })
});

/* ---------- 登录 ---------- */

async function post(path, data) {
  const body = new URLSearchParams(data || {});
  const r = await fetch(path, { method: 'POST', body });
  return r.json();
}

$('doLogin').onclick = async () => {
  const name = $('lname').value.trim();
  const password = $('lpass').value;
  if (!name || !password) { $('lhint').textContent = '昵称和密码都要填'; return; }
  const res = await post('/login', { name, password });
  if (res.ok) enter(res.token, res.name);
  else $('lhint').textContent = res.msg || '登录失败';
};

$('doReg').onclick = async () => {
  const name = $('lname').value.trim();
  const password = $('lpass').value;
  if (!name || !password) { $('lhint').textContent = '昵称和密码都要填'; return; }
  const res = await post('/register', { name, password });
  $('lhint').textContent = res.ok ? '注册成功，点登录吧' : (res.msg || '注册失败');
};

async function enter(t, name) {
  token = t; me = name;
  localStorage.setItem('token', t);
  $('login').style.display = 'none';
  $('app').classList.add('on');
  $('meName').textContent = me;
  await loadRead();
  refreshState();
  poll();
  setInterval(refreshState, 5000);
}

//从服务端取回已读位置
async function loadRead() {
  try {
    const r = await fetch('/read?token=' + encodeURIComponent(token));
    readUpTo = await r.json();
  } catch (e) {
    readUpTo = {};
  }
}

/* 刷新页面后自动恢复登录 */
(async function restore() {
  const saved = localStorage.getItem('token');
  if (!saved) return;
  try {
    const s = await (await fetch('/state?token=' + encodeURIComponent(saved))).json();
    if (s.ok) enter(saved, s.me);
    else localStorage.removeItem('token');
  } catch (e) { }
})();

$('logout').onclick = async () => {
  try { await fetch('/logout?token=' + encodeURIComponent(token)); } catch (e) { }
  localStorage.removeItem('token');
  location.reload();
};

/* ---------- 会话列表 ---------- */

async function refreshState() {
  try {
    const r = await fetch('/state?token=' + encodeURIComponent(token));
    const s = await r.json();
    if (!s.ok) return;
    users.length = 0;
    for (const u of s.users) {
      if (u.name === me) continue;
      users.push(u);
      //重新上线了，就把之前移除的会话加回来
      if (u.online && removed.has(u.name)) {
        removed.delete(u.name);
        saveRemoved();
      }
    }
    renderSide();
  } catch (e) { }
}

function makeItem(name, online) {
  const d = document.createElement('div');
  d.className = 'item' + (current === name ? ' on' : '') + (online ? '' : ' off');

  const dot = document.createElement('span');
  dot.className = 'dot';
  d.appendChild(dot);
  d.appendChild(document.createTextNode(name));

  if (!online) {
    const sub = document.createElement('span');
    sub.className = 'sub';
    sub.textContent = '已下线';
    d.appendChild(sub);
  }

  if (unread[name]) {
    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = unread[name] > 99 ? '99+' : unread[name];
    d.appendChild(badge);
  }

  d.onclick = () => switchTo(name);
  bindContext(d, name, online);
  return d;
}

function renderSide() {
  const side = $('sideList');
  side.innerHTML = '';

  const g = document.createElement('div');
  g.className = 'item' + (current === '群聊' ? ' on' : '');
  g.textContent = '群聊';
  g.onclick = () => switchTo('群聊');
  side.appendChild(g);

  const shown = users.filter(u => !removed.has(u.name));
  const on = shown.filter(u => u.online);
  const off = shown.filter(u => !u.online);

  if (on.length) {
    const label = document.createElement('div');
    label.className = 'group';
    label.textContent = '在线 · ' + on.length;
    side.appendChild(label);
    for (const u of on) side.appendChild(makeItem(u.name, true));
  }

  if (off.length) {
    const label = document.createElement('div');
    label.className = 'group';
    label.textContent = '离线 · ' + off.length;
    side.appendChild(label);
    for (const u of off) side.appendChild(makeItem(u.name, false));
  }
}

/* ---------- 右键 / 长按菜单 ---------- */

let ctxTarget = '';
let ctxOnline = false;

function showCtx(x, y, name, online) {
  ctxTarget = name;
  ctxOnline = online;

  //在线的会话不给删
  const item = $('ctxRemove');
  if (online) {
    item.textContent = '在线会话不可移除';
    item.classList.add('disabled');
  } else {
    item.textContent = '移除会话';
    item.classList.remove('disabled');
  }

  const ctx = $('ctx');
  ctx.style.left = Math.max(8, Math.min(x, window.innerWidth - 150)) + 'px';
  ctx.style.top = Math.max(8, Math.min(y, window.innerHeight - 60)) + 'px';
  ctx.classList.add('on');
}

function hideCtx() {
  $('ctx').classList.remove('on');
}

function bindContext(el, name, online) {
  el.addEventListener('contextmenu', e => {
    e.preventDefault();
    showCtx(e.clientX, e.clientY, name, online);
  });

  let timer = null;
  el.addEventListener('touchstart', e => {
    const t = e.touches[0];
    timer = setTimeout(() => showCtx(t.clientX, t.clientY, name, online), 500);
  }, { passive: true });
  const cancel = () => clearTimeout(timer);
  el.addEventListener('touchend', cancel);
  el.addEventListener('touchmove', cancel);
}

$('ctxRemove').onclick = () => {
  if (ctxTarget && !ctxOnline) {
    removed.add(ctxTarget);
    saveRemoved();
    if (current === ctxTarget) switchTo('群聊');
    renderSide();
  }
  hideCtx();
};

document.addEventListener('click', e => {
  if (!$('ctx').contains(e.target)) hideCtx();
});

function switchTo(name) {
  current = name;
  delete unread[name];
  readUpTo[name] = since;   //切过来就算读完了
  saveRead(name);
  $('head').textContent = name === '群聊' ? '群聊' : '与 ' + name + ' 私聊';
  renderSide();
  renderChat();
}

/* ---------- 消息渲染 ---------- */

function sessionOf(key) {
  if (!sessions[key]) sessions[key] = [];
  return sessions[key];
}

function keyOf(m) {
  if (m.to === '群聊') return '群聊';
  if (m.from === me) return m.to;
  return m.from;
}

function formatSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}

function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function formatTime(ms) {
  const d = new Date(ms);
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

function formatDay(ms) {
  const d = new Date(ms);
  const now = new Date();
  const sameYear = d.getFullYear() === now.getFullYear();
  return (sameYear ? '' : d.getFullYear() + '年') + (d.getMonth() + 1) + '月' + d.getDate() + '日';
}

function renderChat() {
  const list = $('list');
  list.innerHTML = '';
  const msgs = sessionOf(current);

  if (!msgs.length) {
    const e = document.createElement('div');
    e.style.cssText = 'color:var(--muted);text-align:center;margin-top:30vh;font-size:14px';
    e.textContent = current === '群聊' ? '还没有消息，说点什么吧' : '还没有和 ' + current + ' 聊过';
    list.appendChild(e);
    return;
  }

  let lastDay = '';
  for (const m of msgs) {
    const day = formatDay(m.time);
    if (day !== lastDay) {
      lastDay = day;
      const sep = document.createElement('div');
      sep.className = 'day';
      sep.textContent = day;
      list.appendChild(sep);
    }

    const mine = m.from === me;
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (mine ? 'mine' : 'theirs');

    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = mine ? me : m.from;
    wrap.appendChild(who);

    if (m.kind === 'emoji') {
      const img = document.createElement('img');
      img.className = 'emoji';
      img.src = '/emojiimg?name=' + encodeURIComponent(m.text);
      img.alt = '[表情]';
      wrap.appendChild(img);
    } else if (m.kind === 'file') {
      const a = document.createElement('a');
      a.className = 'file';
      a.href = '/download?id=' + m.fileId;
      a.innerHTML = '<span>📎 ' + m.fileName + '</span><span class="sz">' + formatSize(m.fileSize) + '</span>';
      wrap.appendChild(a);
    } else {
      const b = document.createElement('div');
      b.className = 'bubble';
      b.textContent = m.text;
      wrap.appendChild(b);
    }

    const timeEl = document.createElement('div');
    timeEl.className = 'time';
    timeEl.textContent = formatTime(m.time);
    wrap.appendChild(timeEl);

    list.appendChild(wrap);
  }
  list.scrollTop = list.scrollHeight;
}

/* ---------- 发送 ---------- */

async function sendText() {
  const text = $('text').value.trim();
  if (!text) return;
  $('text').value = '';
  autoGrow();
  await post('/send?token=' + encodeURIComponent(token), { to: current, text });
  pull();
}

async function sendEmoji(id) {
  $('emojiPanel').classList.remove('on');
  await post('/emoji?token=' + encodeURIComponent(token), { to: current, id });
  pull();
}

$('sendBtn').onclick = sendText;

//电脑端：回车发送，Shift+回车换行；手机端回车就是换行，发送只能点按钮
const isMobile = () => window.matchMedia('(max-width: 700px)').matches;

$('text').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  if (isMobile() || e.shiftKey) return;   //留给浏览器：插入换行
  e.preventDefault();
  sendText();
});

function autoGrow() {
  const t = $('text');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 120) + 'px';
}
$('text').addEventListener('input', autoGrow);

/* ---------- 表情面板 ---------- */

$('emojiBtn').onclick = async () => {
  const panel = $('emojiPanel');
  if (panel.classList.contains('on')) { panel.classList.remove('on'); return; }

  const list = await (await fetch('/emojis')).json();
  panel.innerHTML = '';
  if (!list.length) {
    panel.textContent = '没有表情图';
    panel.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:6px">emoji 目录是空的</div>';
  }
  for (const id of list) {
    const img = document.createElement('img');
    img.src = '/emojiimg?name=' + encodeURIComponent(id);
    img.onclick = () => sendEmoji(id);
    panel.appendChild(img);
  }
  panel.classList.add('on');
};

document.addEventListener('click', e => {
  const panel = $('emojiPanel');
  if (!panel.classList.contains('on')) return;
  if (panel.contains(e.target) || e.target === $('emojiBtn')) return;
  panel.classList.remove('on');
});

/* ---------- 文件 ---------- */

$('fileBtn').onclick = () => $('fileInput').click();

$('fileInput').onchange = async () => {
  const file = $('fileInput').files[0];
  if (!file) return;
  $('fileInput').value = '';
  const url = '/upload?token=' + encodeURIComponent(token)
    + '&to=' + encodeURIComponent(current)
    + '&name=' + encodeURIComponent(file.name);
  await fetch(url, { method: 'POST', body: file });
  pull();
};

/* ---------- 轮询 ---------- */

async function pull() {
  try {
    const r = await fetch('/poll?since=' + since + '&token=' + encodeURIComponent(token));
    const arr = await r.json();
    if (!Array.isArray(arr)) return;
    let changed = false;
    let sideChanged = false;
    for (const m of arr) {
      if (m.id <= since) continue;
      since = m.id;
      const k = keyOf(m);
      //对方发来新消息，就把被移除的会话找回来
      if (removed.has(k)) {
        removed.delete(k);
        saveRemoved();
        sideChanged = true;
      }
      sessionOf(k).push(m);
      if (k === current) {
        changed = true;
        //正在看的会话，顺带把已读位置推上去
        if (m.id > (readUpTo[k] || 0)) {
          readUpTo[k] = m.id;
          saveRead(k);
        }
      } else if (m.from !== me && m.id > (readUpTo[k] || 0)) {
        //不是当前会话、又不是自己发的、而且确实没读过，才算未读
        unread[k] = (unread[k] || 0) + 1;
        sideChanged = true;
      }
    }
    if (changed) renderChat();
    if (sideChanged) renderSide();
  } catch (e) { }
}

function poll() {
  pull();
  setTimeout(poll, 1000);
}
</script>
</body>
</html>
